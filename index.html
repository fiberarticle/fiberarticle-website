<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Everything between the two markers below is the per-page head. The
         build (scripts/prerender.mjs) swaps it for each route's own title,
         description, canonical link, social tags and structured data, and
         src/seo/useHead.js keeps it in step while a visitor moves between
         pages. What sits here by default is the home page's head. -->
    <!--head-start-->
    <title>Fiberarticle</title>
    <meta
      name="description"
      content="Fiberarticle is an open source agentic AI for academic research. It finds papers across arXiv, OpenAlex, Semantic Scholar and Crossref, reads open-access PDFs, tracks every reference, and writes publication-ready articles."
    />
    <meta property="og:title" content="Fiberarticle | Open Source Agentic AI Researcher" />
    <meta
      property="og:description"
      content="An agentic AI that discovers academic sources, reads and synthesizes the literature, tracks references, and writes publication-ready articles. Open source and self-hostable."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fiberarticle.com" />
    <link rel="canonical" href="https://fiberarticle.com" />
    <!--head-end-->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/favicon.svg?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Body and UI fonts use display=swap so text is never hidden. Kalam (the
         handwriting) and Courier Prime (the typewriter) belong to the blog;
         a browser only downloads a face when a page actually uses it, so the
         home page pays nothing for them. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@300;400;700&family=Courier+Prime:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- Display fonts (headline, logo) use display=block: the browser waits
         briefly for the real font instead of flashing a cursive fallback and
         then swapping. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Faster+One&family=MonteCarlo&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
